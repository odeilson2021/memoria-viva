name: CI e Deploy de Producao

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  ci:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, xml, curl, json
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias de desenvolvimento
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validar Composer e sintaxe PHP
        run: |
          composer validate --no-check-publish
          find app config routes resources database bin tools -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Analise estatica
        run: composer analyse

      - name: Testes automatizados
        run: ./vendor/bin/phpunit

  deploy:
    name: Deploy SSH, migrations e health check
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout da revisao validada
        uses: actions/checkout@v4

      - name: Validar secrets obrigatorios
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "Secret SSH_HOST (ou SERVER_IP) ausente"; exit 1; }
          test -n "$SSH_USER" || { echo "Secret SSH_USER ausente"; exit 1; }
          test -n "$SSH_KEY" || { echo "Secret SSH_KEY (ou SSH_PRIVATE_KEY) ausente"; exit 1; }

      - name: PHP 8.2 para pacote de producao
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, xml, curl, json
          tools: composer:v2

      - name: Dependencias otimizadas de producao
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Identificar revisao
        run: printf '%s\n' '${{ github.sha }}' > public/.deploy-version

      - name: Carregar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Validar host SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -H -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST || secrets.SERVER_IP }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Criar snapshot para rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            DEPLOY_PATH="${{ secrets.SERVER_PATH }}"
            ROLLBACK_FILE="/tmp/deploy-${{ github.sha }}.tar.gz"
            test -d "$DEPLOY_PATH"
            test -f "$DEPLOY_PATH/.env"
            tar --exclude='.env' --exclude='storage/logs' --exclude='storage/cache' --exclude='storage/sessions' --exclude='storage/uploads' --exclude='public/uploads' -czf "$ROLLBACK_FILE" -C "$DEPLOY_PATH" .

      - name: Sincronizar aplicacao via SSH
        run: |
          set -euo pipefail
          rsync -az --checksum --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='storage/logs/' \
            --exclude='storage/cache/' \
            --exclude='storage/sessions/' \
            --exclude='storage/uploads/' \
            --exclude='public/uploads/' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST || secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}/"

      - name: Migrations, cache e verificacao de producao
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu
            DEPLOY_PATH="${{ secrets.SERVER_PATH }}"
            ROLLBACK_FILE="/tmp/deploy-${{ github.sha }}.tar.gz"
            rollback_on_failure() {
              status=$?
              if [ "$status" -eq 0 ]; then return; fi
              echo "Deploy falhou; restaurando snapshot de codigo..."
              tar -xzf "$ROLLBACK_FILE" -C "$DEPLOY_PATH"
              php "$DEPLOY_PATH/tools/cache-clear.php" || true
            }
            trap rollback_on_failure EXIT
            cd "$DEPLOY_PATH"
            test "$(tr -d '\r\n' < public/.deploy-version)" = "${{ github.sha }}"
            test -f .env
            mkdir -p storage/logs storage/cache storage/uploads storage/sessions public/uploads
            find storage public/uploads -type d -exec chmod 755 {} +
            find storage public/uploads -type f -exec chmod 640 {} +
            composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction
            php bin/backup-database.php "deploy-${{ github.sha }}"
            MIGRATION_SAFE_GUARD=1 GITHUB_SHA="${{ github.sha }}" php bin/doctrine-migrations migrate --no-interaction --allow-no-migration
            GITHUB_SHA="${{ github.sha }}" php bin/migrate.php
            php tools/cache-clear.php
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm || true
            fi
            HEALTHCHECK_URL="${{ secrets.HEALTHCHECK_URL }}"
            HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 3 "$HEALTHCHECK_URL" || true)"
            test "$HTTP_STATUS" = "200"
            rm -f "$ROLLBACK_FILE"
            echo "Deploy concluido: ${{ github.sha }}"

      - name: Rollback independente em qualquer falha do CD
        if: ${{ failure() }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            set -u
            DEPLOY_PATH="${{ secrets.SERVER_PATH }}"
            ROLLBACK_FILE="/tmp/deploy-${{ github.sha }}.tar.gz"
            if [ -f "$ROLLBACK_FILE" ] && [ -d "$DEPLOY_PATH" ]; then
              echo "Restaurando snapshot de codigo apos falha no deploy..."
              tar -xzf "$ROLLBACK_FILE" -C "$DEPLOY_PATH"
              php "$DEPLOY_PATH/tools/cache-clear.php" || true
              rm -f "$ROLLBACK_FILE"
              echo "Rollback de codigo concluido. O backup de banco permanece disponivel para analise manual."
            else
              echo "Snapshot de rollback nao encontrado; nenhuma restauracao foi executada."
            fi